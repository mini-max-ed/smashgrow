<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<title>스매시 그로우 메모리 도감</title>
<style>
:root{
  --bg:#0b1230; --win:#101a44; --line:#e9edf7; --ink:#f4f6ff; --dim:#9aa6d1; --dim2:#66719c;
  --y:#f2c94c; --b:#5b9bff; --rd:#ff6b6b; --g:#5ad38a; --p:#c08cff;
  --hot:#ff8a5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.45}
body{padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:2px solid var(--line)}
h1{margin:0 0 8px;font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
h1 small{font-weight:400;color:var(--dim);font-size:12px}
.search{display:flex;gap:6px}
.search input{flex:1;height:40px;border:2px solid var(--line);border-radius:4px;background:var(--win);color:var(--ink);padding:0 12px;font-size:16px;outline:none}
.search input:focus{border-color:var(--y)}
.search button{height:40px;padding:0 12px;border:2px solid var(--line);background:var(--win);color:var(--ink);border-radius:4px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 11px;border-radius:15px;border:1.5px solid var(--dim2);background:transparent;color:var(--dim);font-size:13px;white-space:nowrap}
.chip.on{border-color:var(--line);background:var(--line);color:#0b1230;font-weight:700}
.chip.sw{padding-left:8px}
.chip .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.rowbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 2px;color:var(--dim);font-size:12px}
.rowbar select{background:var(--win);color:var(--ink);border:1.5px solid var(--dim2);border-radius:4px;padding:4px 6px;font-size:12px}
ul{list-style:none;margin:0;padding:6px 10px 40px}
li{background:var(--win);border:2px solid var(--line);border-radius:6px;margin-bottom:8px;overflow:hidden}
.head{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;padding:10px 12px 10px 0;cursor:pointer;min-height:56px}
.bar{align-self:stretch;border-radius:0 3px 3px 0}
.nm{font-weight:700;font-size:16px;letter-spacing:-.01em}
.nm .rar{font-weight:600;font-size:11px;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:2px;background:#26326a;color:var(--dim)}
.nm .rar.진귀{background:var(--y);color:#2b2000}
.nm .rar.희귀{background:#3d4a86;color:#fff}
.sub{color:var(--dim);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right}
.tier{display:inline-block;min-width:34px;text-align:center;font-size:13px;font-weight:800;padding:2px 8px;border-radius:4px;background:#26326a;color:var(--dim)}
.tier.SS{background:var(--hot);color:#2b1000}.tier.S{background:var(--y);color:#2b2000}.tier.A{background:#3d4a86;color:#fff}.tier.B{background:#2a3670;color:#c9d1f5}
.cost{font-size:12px;color:var(--dim)}
.cost b{color:var(--ink);font-size:14px}
.body{display:none;border-top:1px dashed #3a4780;padding:10px 12px 12px;font-size:14px}
li.open .body{display:block}
.eff{margin:0 0 8px;padding:0}
.eff li{background:none;border:0;margin:0 0 3px;padding:0 0 0 14px;position:relative;border-radius:0}
.eff li::before{content:"▸";position:absolute;left:0;color:var(--y)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 8px;margin:6px 0 10px;background:#0b1230;border-radius:4px;padding:8px 10px}
.stats div{font-size:13px;color:var(--dim);display:flex;justify-content:space-between}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.stats .tot{grid-column:span 2;border-top:1px solid #2a3670;padding-top:4px;margin-top:2px}
.src{font-size:13.5px}
.src span{color:var(--dim);margin-right:6px}
.src p{margin:2px 0}
.empty{text-align:center;color:var(--dim);padding:40px 0}
.legend{padding:6px 14px 0;font-size:11.5px;color:var(--dim2)}
</style>
</head>
<body>
<header>
  <h1>메모리 도감 <small id="cnt"></small></h1>
  <div class="search">
    <input id="q" type="search" placeholder="이름 · 효과 · 획득처 검색" autocomplete="off">
    <button id="clr" type="button">지우기</button>
  </div>
  <div class="chips" id="fcol">
    <button class="chip on" data-v="">모든 색</button>
    <button class="chip sw" data-v="노랑"><i class="dot" style="background:var(--y)"></i>노랑</button>
    <button class="chip sw" data-v="파랑"><i class="dot" style="background:var(--b)"></i>파랑</button>
    <button class="chip sw" data-v="빨강"><i class="dot" style="background:var(--rd)"></i>빨강</button>
    <button class="chip sw" data-v="초록"><i class="dot" style="background:var(--g)"></i>초록</button>
    <button class="chip sw" data-v="보라"><i class="dot" style="background:var(--p)"></i>보라</button>
  </div>
  <div class="chips" id="fpri">
    <button class="chip on" data-v="0">전체</button>
    <button class="chip" data-v="SS">SS만</button>
    <button class="chip" data-v="S">S 이상</button>
    <button class="chip" data-v="A">A 이상</button>
    <button class="chip" data-v="B">B 이상</button>
        <button class="chip" data-v="skill">처음부터 스킬 보유</button>
    <button class="chip" data-v="rare">희귀·진귀</button>
    <button class="chip" data-v="스토리">스토리</button>
    <button class="chip" data-v="이벤트">이벤트</button>
  </div>
</header>
<div class="rowbar">
  <span>탭하면 상세 · 배지는 최강 랭킹 티어</span>
  <select id="sort">
    <option value="p">티어 높은 순</option>
    <option value="cost">코스트 낮은 순</option>
    <option value="costd">코스트 높은 순</option>
    <option value="t">능력치 합계 순</option>
    <option value="n">도감 번호 순</option>
  </select>
</div>
<ul id="list"></ul>
<div class="legend">출처: DQSG 라운지 똥손마왕 9102 님 정리 · 티어는 Game8 최강 메모리 랭킹 (2026-09-15). 스탯은 S랭크 기준 표기값.</div>

const CV={노랑:"var(--y)",파랑:"var(--b)",빨강:"var(--rd)",초록:"var(--g)",보라:"var(--p)"};
const SN=["최대 HP","공격력","공격 마력","회복 마력","수비력","주문 수비력","재주"];
let fcol="", fpri="0", q="", sort="p";
const $=s=>document.querySelector(s);
const TO={SS:6,S:5,A:4,B:3,C:2,D:1};
function render(){
  let a=DATA.filter(d=>{
    if(fcol&&d.col!==fcol)return false;
    if(fpri==="skill"){if(!d.e.some(e=>e.startsWith("처음부터")))return false}
    else if(fpri==="rare"){if(d.r==="일반")return false}
    else if(fpri==="스토리"||fpri==="이벤트"){if(d.c!==fpri)return false}
    else if(TO[fpri]){if(!TO[d.p]||TO[d.p]<TO[fpri])return false}
    if(q){const s=(d.name+" "+d.e.join(" ")+" "+d.src+" "+d.st+" "+d.k).toLowerCase();if(!s.includes(q))return false}
    return true;
  });
  a.sort((x,y)=>{
    if(sort==="p")return (TO[y.p]||0)-(TO[x.p]||0)||(x.cost||999)-(y.cost||999);
    if(sort==="cost")return (x.cost||999)-(y.cost||999);
    if(sort==="costd")return y.cost-x.cost;
    if(sort==="t")return y.t-x.t;
    return (x.c===y.c?0:x.c==="스토리"?-1:1)||x.n.localeCompare(y.n);
  });
  $("#cnt").textContent=a.length+" / "+DATA.length;
  const ul=$("#list"); ul.innerHTML="";
  if(!a.length){ul.innerHTML='<div class="empty">조건에 맞는 메모리가 없습니다.<br>필터를 바꾸거나 검색어를 지워보세요.</div>';return}
  for(const d of a){
    const li=document.createElement("li");
    li.innerHTML=`<div class="head">
      <div class="bar" style="background:${CV[d.col]}"></div>
      <div><div class="nm">${d.name}<span class="rar ${d.r}">${d.r}</span></div>
      <div class="sub">${d.e[0]||""}</div></div>
      <div class="right"><div><span class="tier ${d.p}">${d.p||"-"}</span></div>
      <div class="cost">코스트 <b>${d.cost||"?"}</b></div></div>
    </div>
    <div class="body">
      <ul class="eff">${d.e.map(e=>`<li>${e}</li>`).join("")}</ul>
      <div class="stats">${d.s.map((v,i)=>`<div>${SN[i]}<b>${v}</b></div>`).join("")}<div class="tot">능력치 합계<b>${d.t}</b></div></div>
      <div class="src">
        <p><span>획득처</span>${d.src}</p>
        ${d.st?`<p><span>드롭 스테이지</span>${d.st}</p>`:""}
        <p><span>분류</span>${d.c} ${d.n} · ${d.k}계 · ${d.col}</p>
        ${d.ps?`<p><span>티어 출처</span>${d.ps} 최강 메모리 랭킹</p>`:""}
      </div>
    </div>`;
    li.querySelector(".head").addEventListener("click",()=>li.classList.toggle("open"));
    ul.appendChild(li);
  }
}
function chips(id,cb){$(id).addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;
  $(id).querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));b.classList.add("on");cb(b.dataset.v);render()})}
chips("#fcol",v=>fcol=v); chips("#fpri",v=>fpri=v);
$("#q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();render()});
$("#clr").addEventListener("click",()=>{$("#q").value="";q="";render();$("#q").focus()});
$("#sort").addEventListener("change",e=>{sort=e.target.value;render()});
render();
</script>
